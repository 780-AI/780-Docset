# ==============================================================
# Registry of projects managed by Standard DocSet.
#
# Each project declares a `transport` (local | git | ssh; default = local) plus
# the connection fields that transport needs. A project's adopted Set Version is
# read LIVE from the materialized <root>/docs/SET_VERSION_ADOPTED.md at report
# time — never cached here (single source of truth, per docs/architecture.md § 9).
#
# Add one [[project]] table per managed repository. Examples:
#
# [[project]]                       # local (default; transport key optional)
# name = "example-adopter"
# path = "/Users/you/Documents/example-adopter"
#
# [[project]]                       # git: clone/fetch over SSH, write-back = direct push
# name = "beta"
# transport = "git"
# git_url = "git@gitlab.com:org/beta.git"
# git_branch = "main"               # optional; empty -> the remote's default branch
#
# [[project]]                       # ssh: rsync docs/ to/from a dev host
# name = "gamma"
# transport = "ssh"
# ssh_host = "devbox"               # an ssh alias or user@host
# ssh_path = "/home/me/gamma"
# ==============================================================

# NOTE on machine-affinity: absolute `local` paths are machine-specific. This vault folder syncs
# (Dropbox) across machines whose $HOME differs — a local target registered by absolute path for
# one machine reports non-fatally as unreachable on the others (status/harvest warn + skip; per
# architecture.md § 8). Run write commands for a local target on the machine that holds it.
# EXCEPTION: a target that itself lives in the synced Dropbox folder can be registered with a
# `~/` path — the registry expands `~` at load (registry.py `_build_project`), so every machine
# resolves its own copy. Still run writes on ONE machine at a time and let Dropbox settle before
# touching the target from another (concurrent git ops on a Dropbox-synced repo can conflict).

[[project]]                        # PLAN-009 QA-E pilot adopter (Set v2.0, adopted 2026-08-17)
name = "EverOn.Capital-Signal"
path = "~/Library/CloudStorage/Dropbox/Projects/EverOn.Capital-Signal"   # Dropbox-synced (moved 2026-08-18); ~ resolves per machine

